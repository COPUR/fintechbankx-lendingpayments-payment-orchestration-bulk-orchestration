{{- $required := list "DB_URL" "KAFKA_BOOTSTRAP_SERVERS" "OIDC_ISSUER_URI" "OIDC_JWK_SET_URI" "OIDC_TOKEN_URI" "OIDC_AUDIENCE" "CONSENT_SERVICE_BASE_URL" -}}
{{- range $key := $required }}
{{- if not (index $.Values.config $key) }}
{{- fail (printf "config.%s is required" $key) }}
{{- end }}
{{- end }}
{{- /* Aurora: DB_URL is a PostgreSQL JDBC URL; the vendored platform guard parses it (not a substring search) and every other
     config value that is one, and no value may redirect Spring's configuration, name a profile, override the datasource,
     the Kafka protocol or the startup TLS assertion (templates/_fbx-guard.tpl, templates/_helpers.tpl bulk.guardValues). */ -}}
{{- if not (regexMatch "(?i)^jdbc:(?:[a-z0-9-]+:)*postgresql:" (trim (toString .Values.config.DB_URL))) }}
{{- fail "config.DB_URL must be a PostgreSQL JDBC URL (jdbc:postgresql://...)" }}
{{- end }}
{{- include "bulk.guardValues" $ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bulk.name" . }}
  labels:
    {{- include "bulk.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Micrometer common tags (platform convention): app = service account, squad = namespace.
  METRICS_TAG_APP: {{ .Values.serviceAccount.name | quote }}
  METRICS_TAG_SQUAD: {{ .Release.Namespace | quote }}
