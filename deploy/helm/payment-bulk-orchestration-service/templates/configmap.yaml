{{- $required := list "DB_URL" "KAFKA_BOOTSTRAP_SERVERS" "OIDC_ISSUER_URI" "OIDC_JWK_SET_URI" "OIDC_TOKEN_URI" "OIDC_AUDIENCE" "CONSENT_SERVICE_BASE_URL" -}}
{{- range $key := $required }}
{{- if not (index $.Values.config $key) }}
{{- fail (printf "config.%s is required" $key) }}
{{- end }}
{{- end }}
{{- /* Spring config redirection, datasource/Flyway URL keys and the TLS switch never come from values. */ -}}
{{- include "bulk.guardEnv" (list "config" .Values.config) -}}
{{- /* Aurora: DB_URL is a PostgreSQL JDBC URL, parsed (not searched) for sslmode=verify-full and the mounted RDS CA bundle. */ -}}
{{- if not (regexMatch "(?i)^jdbc:(?:[a-z0-9-]+:)*postgresql:" (trim (toString .Values.config.DB_URL))) }}
{{- fail "config.DB_URL must be a PostgreSQL JDBC URL (jdbc:postgresql://...)" }}
{{- end }}
{{- /* Every config value that is a PostgreSQL JDBC URL is held to the same rule (templates/_helpers.tpl, bulk.validateJdbcUrl). */ -}}
{{- range $key, $value := .Values.config }}
{{- include "bulk.validateJdbcUrl" (dict "root" $ "where" (printf "config.%s" $key) "url" $value) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bulk.name" . }}
  labels:
    {{- include "bulk.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Micrometer common tags (platform convention): app = service account, squad = namespace.
  METRICS_TAG_APP: {{ .Values.serviceAccount.name | quote }}
  METRICS_TAG_SQUAD: {{ .Release.Namespace | quote }}
