{{- $required := list "DB_URL" "KAFKA_BOOTSTRAP_SERVERS" "OIDC_ISSUER_URI" "OIDC_JWK_SET_URI" "OIDC_TOKEN_URI" "OIDC_AUDIENCE" "CONSENT_SERVICE_BASE_URL" -}}
{{- range $key := $required }}
{{- if not (index $.Values.config $key) }}
{{- fail (printf "config.%s is required" $key) }}
{{- end }}
{{- end }}
{{- /* Aurora: verify the server certificate against the mounted RDS CA bundle. */ -}}
{{- $rootcert := printf "sslrootcert=%s/%s" (trimSuffix "/" .Values.rdsCaBundle.mountPath) .Values.rdsCaBundle.key }}
{{- if not (and (contains "sslmode=verify-full" .Values.config.DB_URL) (contains $rootcert .Values.config.DB_URL)) }}
{{- fail (printf "config.DB_URL must use sslmode=verify-full&%s (mounted ConfigMap %s)" $rootcert .Values.rdsCaBundle.configMapName) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bulk.name" . }}
  labels:
    {{- include "bulk.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Micrometer common tags (platform convention): app = service account, squad = namespace.
  METRICS_TAG_APP: {{ .Values.serviceAccount.name | quote }}
  METRICS_TAG_SQUAD: {{ .Release.Namespace | quote }}
