apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bulk.name" . }}
  labels:
    {{- include "bulk.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "bulk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bulk.selectorLabels" . | nindent 8 }}
        app: {{ .Values.serviceAccount.name }}
        version: {{ required "image.tag is required" .Values.image.tag | quote }}
        fintechbankx.io/squad: {{ .Values.squad }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        sidecar.istio.io/inject: "true"
        # Keep the sidecar draining for longer than the app's graceful shutdown
        # (preStop 10 s + spring.lifecycle 25 s), within terminationGracePeriodSeconds.
        proxy.istio.io/config: '{"terminationDrainDuration": "55s"}'
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
        {{- if .Values.kafkaStrimzi.enabled }}
        # Kafka brings its own mutual TLS; the sidecar must not wrap it.
        traffic.sidecar.istio.io/excludeOutboundPorts: "9093"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # Above the sidecar drain (55 s) so neither is killed mid-drain.
      terminationGracePeriodSeconds: 65
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "bulk.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "bulk.selectorLabels" . | nindent 14 }}
      containers:
        - name: payment-bulk-orchestration-service
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: http-management
              containerPort: {{ .Values.service.managementPort }}
          env:
            # Migrations run only in the pre-install/pre-upgrade Job as the
            # schema owner; the pods hold the runtime role and never migrate.
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            # Path of the mounted RDS CA bundle (shared-chart convention, cicd-templates 4f0f266).
            - name: DB_SSL_ROOT_CERT
              value: {{ printf "%s/%s" (trimSuffix "/" .Values.rdsCaBundle.mountPath) .Values.rdsCaBundle.key | quote }}
            # The Kafka profile and protocol come from the boolean kafkaStrimzi.enabled only (guardrail 4a):
            # kafka-msk (IAM over SASL_SSL) or kafka-strimzi (mutual TLS, SSL). No value names a profile
            # (bulk.guardEnv refuses spring.profiles.* and KAFKA_SECURITY_PROTOCOL in config).
            - name: SPRING_PROFILES_ACTIVE
              value: {{ ternary "kafka-strimzi" "kafka-msk" .Values.kafkaStrimzi.enabled }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ ternary "SSL" "SASL_SSL" .Values.kafkaStrimzi.enabled }}
          {{- if .Values.kafkaStrimzi.enabled }}
            - name: KAFKA_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaStrimzi.tlsSecretName }}
                  key: user.crt
            - name: KAFKA_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaStrimzi.tlsSecretName }}
                  key: user.key
            - name: KAFKA_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaStrimzi.tlsSecretName }}
                  key: ca.crt
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "bulk.name" . }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "bulk.secretName" . }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rds-ca-bundle
              mountPath: {{ .Values.rdsCaBundle.mountPath }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rds-ca-bundle
          configMap:
            name: {{ .Values.rdsCaBundle.configMapName }}
            items:
              - key: {{ .Values.rdsCaBundle.key }}
                path: {{ .Values.rdsCaBundle.key }}
