{{- if .Values.migration.enabled }}
{{- /* Guardrail 4a: the vendored platform guard (fbx.guard) runs here too; the Job shares config.DB_URL and the CA bundle. */ -}}
{{- include "bulk.guard" . -}}
{{- /*
Flyway as a separate step (platform contract "Database roles"): runs before
every install and upgrade, as the schema owner, with the db-migration secret.
The service pods never mount that secret and run with SPRING_FLYWAY_ENABLED=false.
Both resources are hooks and are deleted once the hooks succeed, so the owner
credential (the ExternalSecret's target Secret, owned by it) leaves the
namespace with them. A failed Job stays for inspection until the next attempt.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "bulk.migrationName" . }}
  labels:
    {{- include "bulk.externalSecretLabels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "bulk.migrationName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_FLYWAY_USER
      remoteRef:
        key: {{ include "bulk.remoteKey" (list "migration.remoteSecretName" .Values.migration.remoteSecretName .) | quote }}
        property: username
    - secretKey: SPRING_FLYWAY_PASSWORD
      remoteRef:
        key: {{ include "bulk.remoteKey" (list "migration.remoteSecretName" .Values.migration.remoteSecretName .) | quote }}
        property: password
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bulk.migrationName" . }}
  labels:
    {{- include "bulk.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit | int }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds | int }}
  template:
    metadata:
      # app.kubernetes.io/name = the service account name, like the API pods:
      # the mesh repo's NetworkPolicies grant Aurora egress (5432) by that label.
      # Component db-migration keeps the pod out of every selector (they all
      # require component service). No fintechbankx.io/service-id: platform
      # scraping and alerts key on it, and a hook pod is not the service.
      labels:
        {{- include "bulk.instanceLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migration
        fintechbankx.io/squad: {{ .Values.squad | quote }}
        sidecar.istio.io/inject: {{ .Values.migration.istioSidecar | quote }}
      annotations:
        # A classic Istio sidecar never exits, so the Job would never
        # complete; see values migration.istioSidecar.
        sidecar.istio.io/inject: {{ .Values.migration.istioSidecar | quote }}
    spec:
      restartPolicy: Never
      # No serviceAccountName on purpose: the Job runs as the namespace's default
      # service account, with no API token mounted. On a first install Helm runs
      # pre-install hooks before it creates the chart's ServiceAccount, so naming
      # that account would block the hook until it times out. The mesh's Aurora
      # egress for this pod keys on the app.kubernetes.io/name label only
      # (cicd-templates 335a345), not on the service account.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migration
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          args: ["migrate"]
          env:
            - name: DB_URL
              value: {{ .Values.config.DB_URL | quote }}
            # Path of the mounted RDS CA bundle (shared-chart convention, cicd-templates 4f0f266).
            - name: DB_SSL_ROOT_CERT
              value: {{ printf "%s/%s" (trimSuffix "/" .Values.rdsCaBundle.mountPath) .Values.rdsCaBundle.key | quote }}
            # The runtime role V11 grants (Flyway placeholder runtime_role).
            - name: DB_USERNAME
              value: {{ .Values.config.DB_USERNAME | quote }}
          envFrom:
            - secretRef:
                name: {{ include "bulk.migrationName" . }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rds-ca-bundle
              mountPath: {{ .Values.rdsCaBundle.mountPath | quote }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rds-ca-bundle
          configMap:
            name: {{ .Values.rdsCaBundle.configMapName | quote }}
            items:
              - key: {{ .Values.rdsCaBundle.key | quote }}
                path: {{ .Values.rdsCaBundle.key | quote }}
{{- end }}
