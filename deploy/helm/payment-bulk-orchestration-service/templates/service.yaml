apiVersion: v1
kind: Service
metadata:
  name: {{ include "bulk.name" . }}
  labels:
    {{- include "bulk.labels" . | nindent 4 }}
    app: {{ .Values.serviceAccount.name }}
spec:
  type: ClusterIP
  selector:
    {{- include "bulk.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: http-management
      port: {{ .Values.service.managementPort }}
      targetPort: http-management
