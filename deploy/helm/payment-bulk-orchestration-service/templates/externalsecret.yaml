{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "bulk.secretName" . }}
  labels:
    {{- include "bulk.externalSecretLabels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "bulk.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ include "bulk.remoteKey" (list "externalSecret.remoteSecretName" .Values.externalSecret.remoteSecretName .) | quote }}
        property: password
    - secretKey: SERVICE_CLIENT_SECRET
      remoteRef:
        key: {{ include "bulk.remoteKey" (list "externalSecret.serviceClientSecretName" .Values.externalSecret.serviceClientSecretName .) | quote }}
        property: client_secret
{{- end }}
