// Runnable Spring Boot service (svc-pay-bulk-orchestration). Wires the domain,
// application and infrastructure modules; holds runtime configuration only.

apply plugin: 'org.springframework.boot'

description = 'Bulk orchestration bootstrap - deployable svc-pay-bulk-orchestration service'

dependencies {
    implementation project(':open-finance-infrastructure')
    implementation project(':open-finance-application')
    implementation project(':open-finance-domain')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.kafka:spring-kafka'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // Traces to the platform OTel collector (OTLP/HTTP).
    runtimeOnly 'io.micrometer:micrometer-tracing-bridge-otel'
    runtimeOnly 'io.opentelemetry:opentelemetry-exporter-otlp'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

springBoot {
    mainClass = 'com.enterprise.openfinance.bulkpayments.BulkOrchestrationApplication'
    buildInfo()
}

bootJar {
    archiveFileName = 'payment-bulk-orchestration-service.jar'
}

jar {
    enabled = false
}
