name: Deployability

# Proves every change still produces a runnable image and valid deployment
# manifests. Nothing is pushed or applied from here.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  container:
    name: deploy/container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag payment-bulk-orchestration-service:${{ github.sha }} .
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' payment-bulk-orchestration-service:${{ github.sha }})"
          echo "image user: $user"
          test "$user" = "10001:10001"

  helm:
    name: deploy/helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      # Guardrail 4a: templates/_fbx_helpers.tpl is a byte-identical copy of the platform chart's helpers
      # (README "Vendoring the guard"); an edited copy, an fbx.* redefinition in another template or a workload
      # template that does not call the guard first fails here. Re-copy from the platform and update the commit and
      # the sum together; scripts/ci/verify-vendored-guard.sh is a byte copy of the platform script at the same commit.
      - name: Vendored guard matches the platform copy
        run: |
          # Source repository: COPUR/fintechbankx-platform-delivery-iac-cicd-templates
          # Path: charts/fintechbankx-service/templates/_helpers.tpl, commit 73e1881 (sha256 pinned below)
          scripts/ci/verify-vendored-guard.sh deploy/helm/payment-bulk-orchestration-service 4f2cdfe056f5afce0297f699c8b66cb80dc42e8e311759bf4a973f8a15b28b2d
      - name: Lint and render chart
        run: bash scripts/ci/chart-render-probes.sh

      - name: Migration credential stays in the migration ExternalSecret
        # SPRING_FLYWAY_USER and SPRING_FLYWAY_PASSWORD are chart literals (the schema-owner credential, Job only);
        # fbx.guard refuses every spring.flyway.* name, so it cannot check them. Pin them here.
        run: |
          chart=deploy/helm/payment-bulk-orchestration-service
          args="--set image.repository=ci/payment-bulk-orchestration-service --set image.tag=${{ github.sha }}"
          args="$args --set externalSecret.remoteSecretName=dev/payment-bulk-orchestration-service/db-app"
          args="$args --set externalSecret.serviceClientSecretName=dev/payment-bulk-orchestration-service/oidc-client"
          args="$args --set migration.remoteSecretName=dev/payment-bulk-orchestration-service/db-migration"
          args="$args --set-string config.DB_URL=jdbc:postgresql://ci-db:5432/db_pay_bulk_orchestration_ci?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"
          args="$args --set config.KAFKA_BOOTSTRAP_SERVERS=ci-kafka:9098"
          args="$args --set config.OIDC_ISSUER_URI=https://ci-idp/realms/fintechbankx"
          args="$args --set config.OIDC_JWK_SET_URI=https://ci-idp/realms/fintechbankx/protocol/openid-connect/certs"
          args="$args --set config.OIDC_TOKEN_URI=https://ci-idp/realms/fintechbankx/protocol/openid-connect/token"
          args="$args --set config.ACCOUNTS_SERVICE_BASE_URL=http://ci-accounts:8080"
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml==6.0.2
          rendered_file="$(mktemp)"
          helm template ci "$chart" --namespace payments $args > "$rendered_file"
          python3 - "$rendered_file" <<'PY'
          import json, sys, yaml
          migration_key = "dev/payment-bulk-orchestration-service/db-migration"
          wanted = {"SPRING_FLYWAY_USER", "SPRING_FLYWAY_PASSWORD"}
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          ess = [d for d in docs if d["kind"] == "ExternalSecret"]
          mig = [d for d in ess if d["metadata"]["labels"].get("app.kubernetes.io/component") == "db-migration"]
          api = [d for d in ess if d["metadata"]["labels"].get("app.kubernetes.io/component") == "service"]
          assert len(mig) == 1 and len(api) == 1 and len(ess) == 2, "expected one migration and one API ExternalSecret"
          data = mig[0]["spec"]["data"]
          keys = [e["secretKey"] for e in data]
          assert len(keys) == len(set(keys)) and set(keys) == wanted, f"migration ExternalSecret secretKeys {keys}, want exactly {sorted(wanted)}"
          for e in data:
              assert e["remoteRef"]["key"] == migration_key, f"{e["secretKey"]} reads {e["remoteRef"]["key"]}, want {migration_key}"
          api_keys = {e["secretKey"] for e in api[0]["spec"]["data"]}
          assert not api_keys & wanted, f"API ExternalSecret carries {sorted(api_keys & wanted)}"
          mig_secret = mig[0]["spec"]["target"]["name"]
          deployments = [d for d in docs if d["kind"] == "Deployment"]
          assert deployments, "no Deployment rendered"
          for d in deployments:
              spec = d["spec"]["template"]["spec"]
              for c in spec.get("containers", []) + spec.get("initContainers", []):
                  for ref in c.get("envFrom", []):
                      for k in ("secretRef", "configMapRef"):
                          assert ref.get(k, {}).get("name") != mig_secret, f"Deployment envFrom references {mig_secret}"
                  for ev in c.get("env", []):
                      assert ev["name"] not in wanted, f"Deployment env sets {ev["name"]}"
                      sk = ev.get("valueFrom", {}).get("secretKeyRef", {})
                      assert sk.get("name") != mig_secret and sk.get("key") not in wanted, f"Deployment env {ev["name"]} reads the migration secret"
              blob = json.dumps(spec)
              for needle in [mig_secret, migration_key, *wanted]:
                  assert needle not in blob, f"Deployment pod spec mentions {needle}"
          print("migration credential pinned: Job-only, keys", sorted(wanted))
          PY

      - name: Image is one scalar and the migration Job runs as its own account
        # Round-8 review: an image value cannot append container fields (command, args) the guard never saw.
        run: |
          chart=deploy/helm/payment-bulk-orchestration-service
          args="--set image.repository=ci/payment-bulk-orchestration-service --set image.tag=${{ github.sha }}"
          args="$args --set externalSecret.remoteSecretName=dev/payment-bulk-orchestration-service/db-app"
          args="$args --set externalSecret.serviceClientSecretName=dev/payment-bulk-orchestration-service/oidc-client"
          args="$args --set migration.remoteSecretName=dev/payment-bulk-orchestration-service/db-migration"
          args="$args --set-string config.DB_URL=jdbc:postgresql://ci-db:5432/db_pay_bulk_orchestration_ci?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"
          args="$args --set config.KAFKA_BOOTSTRAP_SERVERS=ci-kafka:9098"
          args="$args --set config.OIDC_ISSUER_URI=https://ci-idp/realms/fintechbankx"
          args="$args --set config.OIDC_JWK_SET_URI=https://ci-idp/realms/fintechbankx/protocol/openid-connect/certs"
          args="$args --set config.OIDC_TOKEN_URI=https://ci-idp/realms/fintechbankx/protocol/openid-connect/token"
          args="$args --set config.ACCOUNTS_SERVICE_BASE_URL=http://ci-accounts:8080"
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml==6.0.2
          tmp="$(mktemp -d)"
          # --set-file applies after the --set in $args.
          printf 'ci/bulk"\n          command: ["sh"]\n          args: ["-c", "x"]\n          x: "y' > "$tmp/image.txt"
          helm template ci "$chart" --namespace payments $args --set-file "image.repository=$tmp/image.txt" > "$tmp/r.yaml"
          python3 - "$tmp/r.yaml" <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          seen = set()
          for d in docs:
              if d["kind"] not in ("Deployment", "Job"):
                  continue
              seen.add(d["kind"])
              for c in d["spec"]["template"]["spec"]["containers"]:
                  assert isinstance(c["image"], str) and c["image"].startswith('ci/bulk"\n'), c["image"]
                  assert "command" not in c, c.get("command")
                  if d["kind"] == "Deployment":
                      assert "args" not in c, c.get("args")
                  else:
                      assert c["args"] == ["migrate"], c["args"]
          assert seen == {"Deployment", "Job"}, seen
          print("image: one scalar, no command or args added")
          PY
          # Platform round 7: the migration Job runs as its own hook ServiceAccount (no token, no IAM
          # role), created before the Job, never the chart's account or the namespace default.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml==6.0.2
          helm template ci "$chart" --namespace payments $args | python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          job = [d for d in docs if d["kind"] == "Job"][0]
          name = job["spec"]["template"]["spec"].get("serviceAccountName")
          sas = {d["metadata"]["name"]: d for d in docs if d["kind"] == "ServiceAccount"}
          assert name and name in sas, (name, sorted(sas))
          sa = sas[name]["metadata"]
          dep = [d for d in docs if d["kind"] == "Deployment"][0]["spec"]["template"]["spec"]
          assert name != dep.get("serviceAccountName"), name
          assert sa["annotations"]["helm.sh/hook"] == job["metadata"]["annotations"]["helm.sh/hook"], sa
          assert int(sa["annotations"]["helm.sh/hook-weight"]) < int(job["metadata"]["annotations"]["helm.sh/hook-weight"]), sa
          assert sas[name].get("automountServiceAccountToken") is False and not sa.get("annotations", {}).get("eks.amazonaws.com/role-arn"), sa
          assert job["spec"]["template"]["spec"]["automountServiceAccountToken"] is False
          print("migration Job runs as hook ServiceAccount", name)'

      - name: DB connection alarm budget matches the chart
        # deploy/terraform sizes the Aurora connection alarm from (service_max_replicas + service_max_surge) x
        # db_pool_max + headroom; those must be the chart's HPA maxReplicas, Deployment maxSurge and DB_POOL_MAX
        # per environment (defaults = prod shape).
        run: |
          chart=deploy/helm/payment-bulk-orchestration-service
          tf=deploy/terraform
          args="--set image.repository=ci/payment-bulk-orchestration-service --set image.tag=${{ github.sha }}"
          args="$args --set externalSecret.remoteSecretName=dev/payment-bulk-orchestration-service/db-app"
          args="$args --set externalSecret.serviceClientSecretName=dev/payment-bulk-orchestration-service/oidc-client"
          args="$args --set migration.remoteSecretName=dev/payment-bulk-orchestration-service/db-migration"
          args="$args --set-string config.DB_URL=jdbc:postgresql://ci-db:5432/db_pay_bulk_orchestration_ci?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"
          args="$args --set config.KAFKA_BOOTSTRAP_SERVERS=ci-kafka:9098"
          args="$args --set config.OIDC_ISSUER_URI=https://ci-idp/realms/fintechbankx"
          args="$args --set config.OIDC_JWK_SET_URI=https://ci-idp/realms/fintechbankx/protocol/openid-connect/certs"
          args="$args --set config.OIDC_TOKEN_URI=https://ci-idp/realms/fintechbankx/protocol/openid-connect/token"
          args="$args --set config.ACCOUNTS_SERVICE_BASE_URL=http://ci-accounts:8080"
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml==6.0.2
          helm template ci "$chart" --namespace payments $args \
            | python3 scripts/ci/db-connection-budget-check.py "$tf"
          helm template ci "$chart" --namespace payments -f "$chart/values-dev.yaml" $args \
            | python3 scripts/ci/db-connection-budget-check.py "$tf" "$tf/environments/dev.tfvars.example"
          helm template ci "$chart" --namespace payments $args \
            | python3 scripts/ci/db-connection-budget-check.py "$tf" "$tf/environments/prod.tfvars.example"
          # The check itself must catch a chart that outgrew the budget.
          if helm template ci "$chart" --namespace payments --set autoscaling.maxReplicas=13 $args \
               | python3 scripts/ci/db-connection-budget-check.py "$tf" 2>/dev/null; then
            echo "db-connection-budget-check accepted maxReplicas 13 against a budget sized for 12" >&2; exit 1
          fi

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
