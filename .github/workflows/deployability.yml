name: Deployability

# Proves every change still produces a runnable image and valid deployment
# manifests. Nothing is pushed or applied from here.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  container:
    name: deploy/container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag payment-bulk-orchestration-service:${{ github.sha }} .
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' payment-bulk-orchestration-service:${{ github.sha }})"
          echo "image user: $user"
          test "$user" = "10001:10001"

  helm:
    name: deploy/helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint and render chart
        run: |
          chart=deploy/helm/payment-bulk-orchestration-service
          args="--set image.repository=ci/payment-bulk-orchestration-service --set image.tag=${{ github.sha }}"
          args="$args --set externalSecret.remoteSecretName=ci/db-app --set externalSecret.serviceClientSecretName=ci/oidc-client"
          args="$args --set config.DB_URL=jdbc:postgresql://ci-db:5432/db_pay_bulk_orchestration_ci"
          args="$args --set config.KAFKA_BOOTSTRAP_SERVERS=ci-kafka:9098"
          args="$args --set config.OIDC_ISSUER_URI=https://ci-idp/realms/fintechbankx"
          args="$args --set config.OIDC_JWK_SET_URI=https://ci-idp/realms/fintechbankx/protocol/openid-connect/certs"
          args="$args --set config.OIDC_TOKEN_URI=https://ci-idp/realms/fintechbankx/protocol/openid-connect/token"
          helm lint "$chart" $args
          helm template ci "$chart" --namespace payments $args > /dev/null
          helm template ci "$chart" --namespace payments -f "$chart/values-dev.yaml" $args > /dev/null
          helm template ci "$chart" --namespace payments --set kafkaStrimzi.enabled=true $args > /dev/null
          # A missing required value must fail the render.
          if helm template ci "$chart" --set image.repository=x --set image.tag=y \
               --set externalSecret.remoteSecretName=a --set externalSecret.serviceClientSecretName=b > /dev/null 2>&1; then
            echo "chart rendered without required config"; exit 1
          fi

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
